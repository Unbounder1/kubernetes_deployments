apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-cloudflared-egress
  namespace: blog-prod
spec:
  podSelector:
    matchLabels:
      app: cloudflared  
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: frontend-prod
      ports:
        - protocol: TCP
          port: 4321  
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-cloudflared
  namespace: blog-prod
spec:
  podSelector:
    matchLabels:
      app: cloudflared 
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend-prod 
      ports:
        - protocol: TCP
          port: 4321 
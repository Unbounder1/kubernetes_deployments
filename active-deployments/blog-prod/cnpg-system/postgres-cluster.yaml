apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: blog-prod-database
  namespace: cnpg-system
spec:
  instances: 2
  primaryUpdateStrategy: unsupervised

  bootstrap:
    initdb:
      database: blogdigestdb
      owner: bloguser
      secret:
        name: db-secret  # 🔹 Uses the secret for authentication

  storage:
    size: 5Gi
    storageClass: nfs-client
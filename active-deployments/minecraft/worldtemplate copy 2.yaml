apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft-server
  namespace: minecraft
  labels:
    app: minecraft
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1  
      maxSurge: 0
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      containers:
        - name: minecraft
          image: itzg/minecraft-server
          ports:
            - containerPort: 25565
          resources:
            limits:
              memory: "16Gi"
              cpu: "2"
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE 
              value: "VANILLA"
            - name: VERSION
              value: "1.20.1"
            - name: ENABLE_AUTOPAUSE
              value: "false"
            - name: MOTD
              value: "Welcome to my Kubernetes Minecraft server!"
            - name: HARDCORE
              value: "false"
            - name: DIFFICULTY
              value: "hard"
            - name: MODE
              value: "survival"
            - name: MAX_PLAYERS
              value: "20"
            - name: ALLOW_NETHER
              value: "true"
            - name: ENABLE_COMMAND_BLOCK
              value: "true"
            - name: SPAWN_ANIMALS
              value: "true"
            - name: SPAWN_MONSTERS
              value: "true"
            - name: SPAWN_NPCS
              value: "true"
            - name: PVP
              value: "true"
            - name: ONLINE_MODE
              value: "true"
            - name: ENABLE_RCON
              value: "true"
            - name: RCON_PASSWORD
              value: "minecraft123"
            - name: RCON_PORT
              value: "25575"
            - name: USE_AIKAR_FLAGS
              value: "false"
            - name: MEMORY
              value: "16G"
          volumeMounts:
            - name: world-data
              mountPath: /data/world
      volumes:
        - name: world-data
          hostPath:
            path: "/home/rdong/Documents/DOTSdownload/world"
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: minecraft-service
  namespace: minecraft
spec:
  type: NodePort
  selector:
    app: minecraft
  ports:
    - port: 25565        
      targetPort: 25565     
      nodePort: 32000
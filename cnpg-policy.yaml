apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apiserver-to-cloudnativepg
  namespace: cnpg-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  ingress:
  - from:
    - namespaceSelector: {} 
      podSelector:
        matchLabels:
          apiserver: "true"  
    - ipBlock:
        cidr: 10.96.0.0/12  # Adjust if API server has a different cluster CIDR
    ports:
    - protocol: TCP
      port: 443 
  policyTypes:
  - Ingress
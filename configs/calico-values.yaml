calicoctl:
  enabled: true

calicoNode:
  # envVars:
  #   - name: FELIX_IPTABLESMARKMASK
  #     value: "0xff00ff00"
  # # Enable IP auto-detection method to use the Tailscale interface.
  # autoDetectionMethod: "interface=tailscale0"

  ipv4Pool:
    cidr: "10.244.0.0/16" # Change this to your desired pod network CIDR.

  bgp:
    enabled: true

typha:
  enabled: true

cni:
  config:
    installType: "calico"

# Configure the IP pools.
ipPools:
  - cidr: "10.244.0.0/16"
    encapsulation: IPIP
    natOutgoing: true
    nodeSelector: "all()"